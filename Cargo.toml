[package]
name = "f1-halo-telemetry"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Native Windows DirectX HUD for EA SPORTS F1 25: 2026 Season Pack"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ruzstd = "0.9.1"

[target.'cfg(windows)'.dependencies]
windows-numerics = "0.3.1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition", "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
    "Win32_Graphics_Imaging",
    "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Threading",
    "Win32_System_ProcessStatus", "Win32_System_Performance", "Win32_System_Registry",
    "Win32_System_Diagnostics_ToolHelp", "Win32_System_WindowsProgramming",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_XboxController", "Win32_UI_Controls",
    "Win32_UI_Shell", "Win32_Security", "Win32_Storage_FileSystem"
] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[[bench]]
name = "parser"
harness = false

